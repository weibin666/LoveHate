version: "3.8"
name: lovehate

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: lovehate
      POSTGRES_PASSWORD: lovehate_secret
      POSTGRES_DB: lovehate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lovehate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lovehate:lovehate_secret@db:5432/lovehate
      DATABASE_URL_ASYNC: postgresql+asyncpg://lovehate:lovehate_secret@db:5432/lovehate
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-to-a-random-secret-in-production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  pgdata:
